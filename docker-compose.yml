services:
  app:
    image: nginx:alpine
    volumes:
      - ./html:/usr/share/nginx/html:ro
    restart: unless-stopped
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.agenda.rule=Host(`agenda2026.esaullorenzo.es`)"
      - "traefik.http.routers.agenda.entrypoints=websecure"
      - "traefik.http.routers.agenda.tls.certresolver=letsencrypt"
      - "traefik.http.services.agenda.loadbalancer.server.port=80"
    network_mode: host
